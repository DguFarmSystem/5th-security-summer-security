<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>최현민 프로필 - Farm System</title>
    <!-- CSS 파일 연결 (라우터 주소에 맞춤) -->
    <link rel="stylesheet" href="/css/choi-hyunmin.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="profile-container">
        <!-- 프로필 카드 영역 -->
        <div class="profile-card">
            <!-- 상단 배경 포인트 색상 영역 -->
            <div class="profile-header">
                <!-- 아바타 -->
                <div class="profile-avatar">👨‍💻</div>
            </div>
            
            <!-- 프로필 상세 정보 영역 -->
            <div class="profile-body">
                <h1 class="profile-name">최현민</h1>
                <p class="profile-role">Security Team Member</p>
                
                <!-- 상세 스펙 박스 -->
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="label">나이</span>
                        <span class="value">25세</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">소속</span>
                        <span class="value">동국대학교</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">전공</span>
                        <span class="value">정보통신공학전공</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">좋아하는 색</span>
                        <span class="value">스카이블루</span>
                    </div>
                </div>
                
                <p class="profile-bio">"보안공부 열심히 하겠습니다"</p>
            </div>
        </div>
    </main>
</body>
</html>
